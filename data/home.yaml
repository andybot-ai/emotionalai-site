hero:
  title: "Helping society govern AI that reads emotion and simulates empathy."
  lede: "Machines are learning to read our faces, voices and words, and to answer as if they care. We're an independent, cross-university research lab studying what that means for people, and advising on what to do about it."
  caption: "An illustration: what a companion app might infer from a short exchange, and how it might respond. We study how these systems read us, how they answer, and what that means for people and society, whether they get us wrong or right."
help:
  title: "How we help"
  cta: "Get in touch"
  points:
    - title: "Independent"
      text: "Our research is funded through competitive, peer-reviewed grants. We work with government, industry and civil society, but we set our own questions and publish what we find."
    - title: "Guidance on emerging technology"
      text: "We advise on systems that read emotion or simulate empathy, from early design through to regulation and standards."
    - title: "Across disciplines"
      text: "Based at Bangor University in Wales, with members and collaborators at universities in the UK and internationally, working across law, media, computing, psychology and policy."
what:
  - key: sensing
    label: "01 · Sensing"
    big: "It reads us"
    text: "Cameras, microphones, wearables and text analysis infer moods and intentions, in cars, classrooms, call centres, toys and public spaces."
  - key: simulating
    label: "02 · Simulating"
    big: "It answers as if it cares"
    text: "Chatbots, AI companions and ghostbots emulate empathy, sometimes by design and sometimes simply as a by-product of how they're built."
  - key: governing
    label: "03 · Governing"
    big: "It needs rules"
    text: "Law, regulation, technical standards and public understanding all have a part to play. We work on each, from the EU AI Act to IEEE 7014.1."
film:
  title: "Automating Empathy… the movie"
  text: "A short animated film on AI companions and emulated empathy. Animation and design by Conor Flanagan, paper art and stop motion by Maria Figueiredo, written and narrated by Ben Bland, music and sound by Steve and Dave Elton."
  youtube: "tGQqTd6b4gM"
  link: "/short-film-on-companions"
