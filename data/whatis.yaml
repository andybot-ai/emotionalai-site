governing:
  - head: "Does it work?"
    qs:
      - "Do these technologies make sense, given how ambiguous emotion and subjective life are?"
      - "How do they handle different national, cultural, social and historical contexts?"
  - head: "Is it fair?"
    qs:
      - "What about bias around race, sex and gender in computer vision and training data?"
      - "What about uses with children?"
      - "Games are one thing. Jobs, border control, education and insurance are another."
  - head: "Who benefits?"
    qs:
      - "Is it desirable that emotions are machine-readable at all?"
      - "Will data about emotion be used in ways that benefit people?"
      - "Should social media companies be registering our moods and mental states? What about data brokers?"
      - "What happens to our relationships with objects and systems that sense or simulate emotion?"
  - head: "Are the rules right?"
    qs:
      - "Are laws and regulations adequate, and are they being followed?"
      - "Data protection focuses on identification. Is identification really the main issue?"
      - "Is law the only answer, or does design matter as much?"
