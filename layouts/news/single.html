{{ define "main" }}{{ $c := .Content | replaceRE `^\s*<h1[^>]*>.*?</h1>` "" | safeHTML }}
<article class="wrap">
  <header class="page-head"><span class="mono">News · <time datetime="{{ .Date.Format "2006-01-02" }}">{{ .Date.Format "2 January 2006" }}</time></span><h1 style="max-width:22ch;font-size:clamp(36px,4.6vw,64px)">{{ .Title }}</h1></header>
  <div class="prose">{{ $c }}<a class="back" href="/news/">← All news</a></div>
</article>
{{ end }}
