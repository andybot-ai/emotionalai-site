<header class="site-head"><div class="wrap">
  <a class="brand" href="/">{{ partial "logo.html" (dict) }}<span>Emotional AI Lab</span></a>
  <button class="menu-btn" type="button" aria-expanded="false" aria-controls="main-nav">Menu</button>
  <nav class="nav" id="main-nav" aria-label="Main">
    {{ $cur := .RelPermalink }}
    <a class="nav-home" href="/"{{ if eq $cur "/" }} aria-current="page"{{ end }}>Home</a>
    {{ range site.Menus.main }}<a href="{{ .URL }}"{{ if or (eq $cur .URL) (eq $cur (printf "%s/" .URL)) (and (ne .URL "/") (hasPrefix $cur .URL) (ne .URL "/so-what-is-emotional-ai")) }} aria-current="page"{{ end }}>{{ .Name }}</a>{{ end }}
    <a class="pill" href="/contact">Contact</a>
  </nav>
</div></header>
<script>(function(){var b=document.querySelector('.menu-btn'),h=document.querySelector('.site-head');if(!b)return;b.addEventListener('click',function(){var o=h.classList.toggle('open');b.setAttribute('aria-expanded',o);b.textContent=o?'Close':'Menu'})})();</script>
